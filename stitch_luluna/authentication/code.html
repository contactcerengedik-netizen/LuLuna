<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .auth-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .form-enter {
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .segmented-control {
            background-color: #edeeee; /* surface-container */
        }
        .segmented-item-active {
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Scrollable Canvas -->
<main class="min-h-screen flex flex-col items-center justify-center px-gutter py-12">
<!-- Header Section -->
<header class="w-full max-w-md text-center mb-stack-lg">
<div class="mb-stack-md flex justify-center">
<img alt="Luluna Logo" class="w-24 h-24 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAqhZ4kqHJWQArT4Vi-yXmW1YbIILjhYfuv-69kZQdz2MPSJoAeB7nV8s19QueqptRxjUYGlTKBxpG-L3546BniyxBg2HEoo9-kMQr60Jnu6LS1ZHQI0h0A82hMsGfw19xhG8OAvIOGmB7U_9WVBIjhDEPb-Tidy0tVRDtkardhbBqd7ExzNLgC0kkW5zEZEwnvCsfZnyRGcIynanNHVYUQbtWYx7sMltKNZ3o0ha2vbcGM8Y6dNwJ3"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-unit">Luluna</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Hoş geldiniz</p>
</header>
<!-- Auth Container -->
<section class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-2xl p-6 md:p-8 auth-card shadow-sm">
<!-- Custom Segmented Control -->
<div class="segmented-control p-1 rounded-xl flex mb-stack-lg">
<button class="flex-1 py-2 font-label-md text-label-md rounded-lg transition-all duration-200 segmented-item-active text-primary" id="loginTab" onclick="toggleAuthMode('login')">Giriş</button>
<button class="flex-1 py-2 font-label-md text-label-md rounded-lg transition-all duration-200 text-on-surface-variant" id="registerTab" onclick="toggleAuthMode('register')">Kayıt</button>
</div>
<!-- Form Area -->
<form class="space-y-stack-md form-enter" id="authForm">
<!-- Name Field (Only for Register) -->
<div class="hidden" id="nameFieldContainer">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-1">Ad Soyad</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full bg-surface border border-outline-variant rounded-xl py-3 pl-10 pr-4 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-outline-variant" placeholder="Adınızı girin" type="text"/>
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-1">E-posta</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface border border-outline-variant rounded-xl py-3 pl-10 pr-4 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-outline-variant" placeholder="ornek@mail.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-1 ml-1">Şifre</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface border border-outline-variant rounded-xl py-3 pl-10 pr-12 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-outline-variant" id="passwordInput" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-white py-4 rounded-xl font-headline-md text-headline-md active:scale-[0.98] transition-transform shadow-md mt-4 hover:brightness-110" id="submitBtn" type="submit">
                    Giriş Yap
                </button>
</form>
<!-- Divider -->
<div class="flex items-center my-stack-lg">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="px-3 font-label-sm text-label-sm text-outline-variant uppercase">veya</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Google Login -->

                Google ile giriş (demo)
            </button>
<!-- Test Accounts Section -->
<div class="mt-stack-lg border-t border-outline-variant pt-stack-md">
<p class="font-label-sm text-label-sm text-on-surface-variant mb-stack-sm text-center">Test hesapları</p>
<div class="flex justify-center gap-stack-sm">
<button class="flex items-center gap-1 px-4 py-1.5 bg-secondary-container text-on-secondary-container rounded-full font-label-sm text-label-sm hover:brightness-95 transition-all" onclick="fillTest('veli')">
<span class="material-symbols-outlined text-[18px]">family_restroom</span>
                        Veli
                    </button>
<button class="flex items-center gap-1 px-4 py-1.5 bg-secondary-container text-on-secondary-container rounded-full font-label-sm text-label-sm hover:brightness-95 transition-all" onclick="fillTest('terapist')">
<span class="material-symbols-outlined text-[18px]">psychology</span>
                        Terapist
                    </button>
</div>
</div>
</section>
<!-- Footer Text -->
<footer class="mt-stack-lg text-center">
<p class="font-label-sm text-label-sm text-outline">© 2024 Luluna AI Health Assistant</p>
</footer>
</main>
<script>
        let currentMode = 'login';

        function toggleAuthMode(mode) {
            currentMode = mode;
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const nameField = document.getElementById('nameFieldContainer');
            const submitBtn = document.getElementById('submitBtn');
            const form = document.getElementById('authForm');

            // Reset animation
            form.classList.remove('form-enter');
            void form.offsetWidth; // Trigger reflow
            form.classList.add('form-enter');

            if (mode === 'login') {
                loginTab.classList.add('segmented-item-active', 'text-primary');
                loginTab.classList.remove('text-on-surface-variant');
                registerTab.classList.remove('segmented-item-active', 'text-primary');
                registerTab.classList.add('text-on-surface-variant');
                nameField.classList.add('hidden');
                submitBtn.innerText = 'Giriş Yap';
            } else {
                registerTab.classList.add('segmented-item-active', 'text-primary');
                registerTab.classList.remove('text-on-surface-variant');
                loginTab.classList.remove('segmented-item-active', 'text-primary');
                loginTab.classList.add('text-on-surface-variant');
                nameField.classList.remove('hidden');
                submitBtn.innerText = 'Kayıt Ol';
            }
        }

        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('passwordIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        function fillTest(type) {
            const emailInput = document.querySelector('input[type="email"]');
            const passwordInput = document.getElementById('passwordInput');
            
            if (type === 'veli') {
                emailInput.value = 'veli@luluna.app';
                passwordInput.value = 'luluna123';
            } else {
                emailInput.value = 'terapist@luluna.app';
                passwordInput.value = 'klinik456';
            }
            
            // Visual feedback
            const btn = event.currentTarget;
            btn.classList.add('scale-95');
            setTimeout(() => btn.classList.remove('scale-95'), 150);
        }

        // Handle form submission prevent default
        document.getElementById('authForm').onsubmit = (e) => {
            e.preventDefault();
            alert('Luluna Demo: Bu ekran sadece tasarım amaçlıdır.');
        };
    </script>
</body></html>
