<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-container": "#005c67",
                    "outline-variant": "#bfc8ca",
                    "background": "#f8f9f9",
                    "surface": "#f8f9f9",
                    "outline": "#6f797b",
                    "on-secondary-container": "#026f77",
                    "on-secondary": "#ffffff",
                    "error-container": "#ffdad6",
                    "primary": "#00434b",
                    "tertiary-container": "#4a5556",
                    "on-error-container": "#93000a",
                    "on-background": "#191c1c",
                    "error": "#ba1a1a",
                    "tertiary": "#343e3f",
                    "primary-fixed": "#a8eefb",
                    "on-tertiary": "#ffffff",
                    "surface-variant": "#e1e3e3",
                    "secondary-fixed": "#9df0f8",
                    "inverse-on-surface": "#f0f1f1",
                    "surface-bright": "#f8f9f9",
                    "surface-container-low": "#f3f4f4",
                    "inverse-primary": "#8cd1de",
                    "surface-container-highest": "#e1e3e3",
                    "on-surface": "#191c1c",
                    "secondary-fixed-dim": "#81d4dc",
                    "surface-container-high": "#e7e8e8",
                    "on-surface-variant": "#3f484a",
                    "tertiary-fixed": "#dae5e6",
                    "on-tertiary-fixed": "#131d1e",
                    "on-primary-fixed": "#001f24",
                    "on-error": "#ffffff",
                    "primary-fixed-dim": "#8cd1de",
                    "on-secondary-fixed": "#002022",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-container": "#bec9ca",
                    "on-tertiary-fixed-variant": "#3e494a",
                    "on-primary-container": "#8dd2df",
                    "tertiary-fixed-dim": "#bec9ca",
                    "on-primary": "#ffffff",
                    "inverse-surface": "#2e3131",
                    "surface-container": "#edeeee",
                    "surface-dim": "#d9dada",
                    "surface-tint": "#196873",
                    "on-secondary-fixed-variant": "#004f55",
                    "secondary": "#006970",
                    "secondary-container": "#9df0f8",
                    "on-primary-fixed-variant": "#004f58"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "16px",
                    "container-padding-desktop": "32px",
                    "stack-sm": "8px",
                    "gutter": "16px",
                    "stack-lg": "32px",
                    "container-padding-mobile": "16px",
                    "unit": "4px"
            },
            "fontFamily": {
                    "label-md": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-lg": ["Manrope"],
                    "label-sm": ["Inter"],
                    "headline-lg-mobile": ["Manrope"],
                    "body-lg": ["Inter"],
                    "headline-md": ["Manrope"]
            },
            "fontSize": {
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-lg-mobile": ["26px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
        }
        .rule-card-enter {
            animation: slideIn 0.3s ease-out forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #bfc8ca;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-xl bg-surface/70 flex justify-between items-center px-container-padding-mobile h-16 transition-all border-b border-outline-variant/10">
<div class="flex items-center gap-4">
<button class="hover:bg-surface-variant/50 p-2 rounded-full transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Terapist Kuralları</h1>
</div>
<button class="font-label-md text-label-md text-primary px-4 py-2 hover:bg-primary/5 rounded-full transition-colors active:scale-95">
            Kaydet
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 pb-32 px-container-padding-mobile">
<div class="max-w-md mx-auto py-stack-md space-y-stack-lg">
<!-- Information Section -->
<section class="space-y-stack-sm">
<div class="flex items-start gap-3 p-4 bg-surface-container-low rounded-xl border border-outline-variant/30">
<span class="material-symbols-outlined text-primary mt-1" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-md text-on-surface-variant leading-relaxed">
                        Bu kurallar system prompt'a <strong class="text-primary font-semibold">'öncelikli'</strong> olarak enjekte edilir. Örn: <span class="italic font-normal">"Kalabalık ortamlarda komut verme, sadece nefes egzersizi yaptır."</span>
</p>
</div>
</section>
<!-- Rule Input Field -->
<section class="space-y-stack-sm">
<div class="relative group">
<textarea class="w-full min-h-[140px] p-4 bg-surface-variant/50 border-2 border-transparent focus:border-primary/20 focus:bg-surface-container-highest rounded-[16px] text-on-surface font-body-md placeholder:text-outline transition-all resize-none focus:outline-none" id="ruleInput" placeholder="Yeni kural ekle..."></textarea>
<button class="absolute bottom-4 right-4 flex items-center justify-center bg-primary text-white w-12 h-12 rounded-full shadow-lg hover:bg-primary-container transition-all active:scale-90 duration-300" id="addRuleBtn">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 600;">add_circle</span>
</button>
</div>
</section>
<!-- Rules List -->
<section class="space-y-stack-md">
<div class="flex items-center justify-between">
<h2 class="font-headline-md text-headline-md text-on-surface">Aktif Kurallar</h2>
<span class="bg-primary/10 text-primary px-3 py-1 rounded-full font-label-sm text-label-sm" id="ruleCount">0 Kural</span>
</div>
<div class="space-y-stack-sm min-h-[100px]" id="rulesContainer">
<!-- Empty State -->
<div class="flex flex-col items-center justify-center py-10 opacity-60" id="emptyState">
<span class="material-symbols-outlined text-outline text-5xl mb-3">gavel</span>
<p class="font-body-md text-outline text-center">Henüz kural yok. Genel davranış kuralları geçerli.</p>
</div>
</div>
</section>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-container-padding-mobile bg-surface/80 backdrop-blur-md">
<div class="max-w-md mx-auto">
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-label-md text-label-md flex items-center justify-center gap-2 shadow-lg shadow-primary/20 hover:bg-primary-container active:scale-[0.98] transition-all duration-300">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Kaydet ve Uygula
            </button>
</div>
</div>
<script>
        const rulesContainer = document.getElementById('rulesContainer');
        const emptyState = document.getElementById('emptyState');
        const ruleInput = document.getElementById('ruleInput');
        const addRuleBtn = document.getElementById('addRuleBtn');
        const ruleCountLabel = document.getElementById('ruleCount');

        let rules = [
            "Seans sırasında kullanıcıyı asla yarıda kesme.",
            "Tıbbi tavsiye verme, her zaman bir uzmana yönlendir."
        ];

        function renderRules() {
            rulesContainer.innerHTML = '';
            
            if (rules.length === 0) {
                rulesContainer.appendChild(emptyState);
                ruleCountLabel.innerText = '0 Kural';
                return;
            }

            ruleCountLabel.innerText = `${rules.length} Kural`;

            rules.forEach((rule, index) => {
                const ruleEl = document.createElement('div');
                ruleEl.className = 'rule-card-enter flex items-start gap-4 p-4 bg-white rounded-[16px] border border-outline-variant/40 shadow-sm hover:border-primary/30 transition-all group';
                ruleEl.innerHTML = `
                    <div class="flex-shrink-0 w-8 h-8 rounded-full bg-primary/5 flex items-center justify-center text-primary font-bold font-label-sm">
                        ${index + 1}
                    </div>
                    <p class="flex-1 font-body-md text-on-surface leading-snug pt-1">
                        ${rule}
                    </p>
                    <button onclick="deleteRule(${index})" class="flex-shrink-0 p-2 text-error hover:bg-error-container/20 rounded-full transition-colors active:scale-90">
                        <span class="material-symbols-outlined">delete</span>
                    </button>
                `;
                rulesContainer.appendChild(ruleEl);
            });
        }

        function deleteRule(index) {
            rules.splice(index, 1);
            renderRules();
        }

        addRuleBtn.addEventListener('click', () => {
            const val = ruleInput.value.trim();
            if (val) {
                rules.push(val);
                ruleInput.value = '';
                renderRules();
                
                // Success feedback
                addRuleBtn.innerHTML = '<span class="material-symbols-outlined">check</span>';
                setTimeout(() => {
                    addRuleBtn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'wght\' 600;">add_circle</span>';
                }, 1000);
            }
        });

        // Initialize
        renderRules();

        // Responsive active states for mobile
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => btn.classList.add('opacity-80'));
            btn.addEventListener('touchend', () => btn.classList.remove('opacity-80'));
        });
    </script>
</body></html>
