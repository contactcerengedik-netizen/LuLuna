<style>
        .glass-nav {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);

        }

<body class="bg-background text-on-surface font-body-md overflow-x-hidden antialiased">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 glass-nav h-16 flex items-center px-4 safe-area-top">
<div class="flex items-center justify-between w-full">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95" onclick="window.location.href='/auth'">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<img alt="Luluna Logo" class="h-8 w-auto" src="https://lh3.googleusercontent.com/aida/AP1WRLsDZ7NU-EBH-7owZg9kQ3bp5vKGy6Zwzg_viefRkZAeH3XV9ZFWNVio-0SkBXUcP7eN7tCs23o3pgWG7wwIXIh048XNIGitxrrgjvtWXvymQlBGzB7-nSklLPmvFeNdUCe6GO6HTnFky7pJFoyDqg0-_DsBn2UaANHm3FKXaSOQi7uRNQuyqFEUkjVh_ARQMaK_9WjMslEoe6eq2yr3Tj9VZ4zaSNDIa-_FdBa8sfDcYkO2zn7EdB6lYW4"/>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Container (SafeArea + ScrollView) -->
<main class="min-h-screen pt-20 pb-12 px-gutter flex flex-col items-center safe-area-bottom">
<!-- Brand Identity Section -->
<div class="mt-8 mb-10 text-center animate-fade-in">
<h1 class="font-headline-lg text-headline-lg text-primary-container tracking-tight">
                Luluna
            </h1>
<p class="font-body-md text-on-surface-variant mt-1">
                Yapay zeka destekli giyilebir yol arkadaşı
            </p>
</div>
<!-- Prompt Section -->
<div class="max-w-md w-full mb-8 text-center space-y-3">
<h2 class="font-headline-md text-headline-md text-on-surface">
                Kim olarak devam etmek istiyorsunuz?
            </h2>
<p class="font-body-md text-on-surface-variant text-center opacity-80 leading-relaxed px-4">
                İlk girişte rolünüzü seçmeniz gerekir. Bu seçim asistan deneyimini ve paneli kişiselleştirir.
            </p>
</div>
<!-- Role Selection Cards -->
<div class="w-full max-w-md space-y-stack-md">
<!-- Role Card: Veli -->
<button class="role-card w-full text-left bg-white border border-outline-variant rounded-2xl p-5 flex items-center gap-4 transition-all duration-300 hover:shadow-lg hover:border-primary-container group">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-secondary-fixed flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" style="font-size: 28px;">family_restroom</span>
</div>
<div class="flex-grow min-w-0">
<h3 class="font-headline-md text-body-lg font-bold text-on-surface group-hover:text-primary-container transition-colors">Veli</h3>
<p class="text-label-md text-on-surface-variant leading-snug mt-0.5 line-clamp-2">
                        Çocuğunuzun profilini oluşturun, canlı akışı izleyin ve kriz anlarında müdahale edin.
                    </p>
</div>
<div class="flex-shrink-0 text-on-surface-variant group-hover:translate-x-1 transition-transform">
<span class="material-symbols-outlined">chevron_right</span>
</div>
</button>
<!-- Role Card: Terapist -->
<button class="role-card w-full text-left bg-white border border-outline-variant rounded-2xl p-5 flex items-center gap-4 transition-all duration-300 hover:shadow-lg hover:border-primary-container group">
<div class="flex-shrink-0 w-12 h-12 rounded-full bg-secondary-fixed flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined" style="font-size: 28px;">psychology</span>
</div>
<div class="flex-grow min-w-0">
<h3 class="font-headline-md text-body-lg font-bold text-on-surface group-hover:text-primary-container transition-colors">Terapist</h3>
<p class="text-label-md text-on-surface-variant leading-snug mt-0.5 line-clamp-2">
                        Gelişim raporlarını inceleyin ve asistanın davranış kurallarını güncelleyin.
                    </p>
</div>
<div class="flex-shrink-0 text-on-surface-variant group-hover:translate-x-1 transition-transform">
<span class="material-symbols-outlined">chevron_right</span>
</div>
</button>
</div>
<!-- Footer / Support Link -->
<div class="mt-auto pt-12 pb-4 text-center">
<p class="text-label-md text-on-surface-variant">
                Yardıma mı ihtiyacınız var? 
                <a class="text-primary-container font-semibold hover:underline underline-offset-4" href="#">Destek Merkezi</a>
</p>
</div>
</main>
<script>
        // Micro-interaction for role selection
        document.querySelectorAll('.role-card').forEach(card => {
            card.addEventListener('click', function() {
                // Haptic feedback simulation
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
                
                // Add temporary active class for visual feedback
                this.classList.add('bg-surface-container-low');
                
                // Navigation logic (example delay for effect)
                setTimeout(() => {
                    const role = this.querySelector('h3').textContent;
                    console.log(`Role selected: ${role}`);
                    // window.location.href = role === 'Veli' ? '/parent-dashboard' : '/therapist-dashboard';
                }, 200);
            });
        });

        // Entrance animation logic
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.role-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 300 + (index * 100));
            });
        });
    </script>
