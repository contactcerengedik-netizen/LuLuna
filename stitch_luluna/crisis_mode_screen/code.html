<style>
        body {
            background-color: #BDEEFA;
            color: #001F26;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .pulse-slow {
            animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 0.25; transform: scale(1.1); }
        }
        .audio-playing .play-icon { content: "pause"; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center">
<!-- Atmospheric Background Element -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-white rounded-full blur-[120px] pulse-slow"></div>
<div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-primary-fixed rounded-full blur-[100px] pulse-slow" style="animation-delay: 2s;"></div>
</div>
<!-- TopAppBar (JSON Hierarchy: Content & Identity) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-4 h-16 w-full max-w-full">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/20 transition-colors" onclick="window.history.back()">
<span class="material-symbols-outlined text-crisis-dark text-[28px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-crisis-dark font-bold">Kriz Modu</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="relative z-10 w-full max-w-md px-gutter flex flex-col items-center pt-24 pb-32 flex-grow overflow-y-auto">
<!-- Hero Section -->
<section class="text-center mb-stack-lg animate-in fade-in slide-in-from-bottom-4 duration-1000">
<div class="mb-6 flex justify-center">
<div class="bg-crisis-dark/5 p-8 rounded-full">
<span class="material-symbols-outlined text-crisis-dark text-[84px]">self_improvement</span>
</div>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-crisis-dark mb-3">Kriz Modu Aktif</h2>
<p class="font-body-md text-body-md text-crisis-dark/80 max-w-[280px] mx-auto">
                Yapay zeka susturuldu. Kerem için sakinleştirici içerik seçin.
            </p>
</section>
<!-- Audio Cards -->
<section class="w-full space-y-stack-md">
<!-- Audio Card 1 -->
<button class="audio-toggle-card w-full glass-card p-5 rounded-xl flex items-center gap-4 text-left transition-all active:scale-95 group" onclick="toggleAudio(this)">
<div class="w-12 h-12 rounded-full bg-crisis-dark flex items-center justify-center">
<span class="material-symbols-outlined text-white">record_voice_over</span>
</div>
<div class="flex-grow">
<h3 class="font-label-md text-label-md text-crisis-dark font-bold">Veli sesi telkinleri</h3>
<p class="font-label-sm text-label-sm text-crisis-dark/60">Önceden kaydedilmiş sakinleştirici telkin</p>
</div>
<div class="w-10 h-10 rounded-full border border-crisis-dark/20 flex items-center justify-center group-hover:bg-crisis-dark/5">
<span class="material-symbols-outlined text-crisis-dark play-status-icon">play_arrow</span>
</div>
</button>
<!-- Audio Card 2 -->
<button class="audio-toggle-card w-full glass-card p-5 rounded-xl flex items-center gap-4 text-left transition-all active:scale-95 group" onclick="toggleAudio(this)">
<div class="w-12 h-12 rounded-full bg-crisis-dark flex items-center justify-center">
<span class="material-symbols-outlined text-white">music_note</span>
</div>
<div class="flex-grow">
<h3 class="font-label-md text-label-md text-crisis-dark font-bold">Sakinleştirici müzik</h3>
<p class="font-label-sm text-label-sm text-crisis-dark/60">Yumuşak ambient melodi</p>
</div>
<div class="w-10 h-10 rounded-full border border-crisis-dark/20 flex items-center justify-center group-hover:bg-crisis-dark/5">
<span class="material-symbols-outlined text-crisis-dark play-status-icon">play_arrow</span>
</div>
</button>
</section>
<!-- Informational Prompt -->
<div class="mt-stack-lg p-6 rounded-2xl bg-white/30 border border-white/20 text-center">
<p class="font-label-sm text-label-sm text-crisis-dark/70 italic">
                "AI asistanı şu an pasif durumda. Sistem sadece güvenli ses çıkışlarına izin veriyor."
            </p>
</div>
</main>
<!-- Bottom Action (Fixed) -->
<footer class="fixed bottom-0 left-0 w-full p-gutter z-50 bg-gradient-to-t from-crisis-bg via-crisis-bg to-transparent">
<div class="max-w-md mx-auto w-full pb-safe">
<button class="w-full h-16 bg-[#022B30] text-white rounded-xl flex items-center justify-center gap-3 shadow-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-headline-md text-headline-md">Krizi Sonlandır</span>
</button>
</div>
</footer>
<script>
        /**
         * State logic for active audio
         * Swaps play/pause icons and manages "exclusive" playback vibe
         */
        function toggleAudio(button) {
            const allIcons = document.querySelectorAll('.play-status-icon');
            const currentIcon = button.querySelector('.play-status-icon');
            const isPlaying = currentIcon.textContent === 'pause';

            // Reset all to play
            allIcons.forEach(icon => {
                icon.textContent = 'play_arrow';
                icon.parentElement.parentElement.classList.remove('bg-white/80', 'ring-2', 'ring-crisis-dark/10');
            });

            if (!isPlaying) {
                // Set current to pause
                currentIcon.textContent = 'pause';
                button.classList.add('bg-white/80', 'ring-2', 'ring-crisis-dark/10');
                
                // Add a haptic feedback simulation
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            }
        }

        // Ambient interaction: Slow movement of the hero icon
        const heroIcon = document.querySelector('.material-symbols-outlined[style*="84px"]');
        if(heroIcon) {
            let angle = 0;
            function animate() {
                angle += 0.02;
                const y = Math.sin(angle) * 5;
                heroIcon.style.transform = `translateY(${y}px)`;
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body></html>
