<style>
        body {
            background-color: #f8f9f9;
            color: #191c1c;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .checkbox-custom:checked + .checkbox-label::before {
            background-color: #005C67;
            border-color: #005C67;
        }
        .glass-header {
            backdrop-filter: blur(12px);
            background-color: rgba(248, 249, 249, 0.7);
        }
        .clinical-shadow {
            box-shadow: 0px 4px 20px rgba(0, 92, 103, 0.15);
        }
        .transition-all-custom {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 glass-header h-16 flex items-center px-4 md:px-8">
<div class="flex items-center w-full relative">
<button class="w-10 h-10 flex items-center justify-center rounded-full active:scale-95 transition-transform hover:bg-surface-container" onclick="window.history.back()">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="absolute left-1/2 -translate-x-1/2 font-headline-md text-headline-md text-on-surface">Açık Rıza</h1>
<div class="ml-auto w-10"></div> <!-- Spacer for symmetry -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 px-container-padding-mobile md:px-container-padding-desktop pb-32 max-w-lg mx-auto w-full">
<!-- Hero Section -->
<section class="mt-stack-lg flex flex-col items-center text-center">
<div class="w-24 h-24 rounded-full border-2 border-primary/20 flex items-center justify-center mb-stack-md bg-primary/5">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="security">security</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-stack-sm">
                KVKK ve Aydınlatma
            </h2>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed px-4">
                İlk girişinizde bir kez onayınızı alıyoruz. Sonraki girişlerde tekrar sorulmaz. Mikrofon, bildirim ve Bluetooth izinleri bir sonraki adımda istenecek.
            </p>
</section>
<!-- Consent Box Section -->
<section class="mt-10">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-start gap-4 transition-all-custom hover:border-primary/40 focus-within:border-primary">
<div class="flex items-center h-6">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary-container transition-all cursor-pointer" id="kvkk-consent" type="checkbox"/>
</div>
<label class="flex-1 font-body-md text-body-md text-on-surface cursor-pointer select-none" for="kvkk-consent">
                    Aydınlatma metnini okudum; kişisel / sağlık verilerimin işlenmesine açık rıza veriyorum.
                </label>
<button class="text-on-surface-variant hover:text-primary transition-colors h-6 flex items-center">
<span class="material-symbols-outlined text-[20px]" data-icon="info">info</span>
</button>
</div>
<!-- Visual Decorative Detail: Trust Indicators -->
<div class="mt-stack-lg grid grid-cols-2 gap-gutter">
<div class="p-4 bg-surface-container-low rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="lock_open">lock_open</span>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface">Güvenli Veri</span>
<span class="text-[10px] text-on-surface-variant leading-tight">Uçtan uca şifreleme</span>
</div>
</div>
<div class="p-4 bg-surface-container-low rounded-xl flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="verified_user">verified_user</span>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface">Tam Şeffaflık</span>
<span class="text-[10px] text-on-surface-variant leading-tight">İstediğiniz an iptal</span>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom CTA -->
<footer class="fixed bottom-0 left-0 right-0 p-container-padding-mobile bg-surface/80 backdrop-blur-md max-w-lg mx-auto w-full">
<button class="w-full h-14 rounded-xl flex items-center justify-center font-headline-md text-headline-md transition-all-custom clinical-shadow bg-surface-dim text-on-surface-variant cursor-not-allowed opacity-70" disabled="" id="cta-button">
            Onayla ve devam et
        </button>
</footer>
<!-- Interactive Logic -->
<script>
        const checkbox = document.getElementById('kvkk-consent');
        const ctaButton = document.getElementById('cta-button');

        checkbox.addEventListener('change', (e) => {
            if (e.target.checked) {
                // Enable State
                ctaButton.disabled = false;
                ctaButton.classList.remove('bg-surface-dim', 'text-on-surface-variant', 'cursor-not-allowed', 'opacity-70');
                ctaButton.classList.add('bg-primary-container', 'text-on-primary-container', 'active:scale-95');
                ctaButton.style.backgroundColor = '#005C67'; // Enforcing Primary Teal
                ctaButton.style.color = '#FFFFFF';
            } else {
                // Disable State
                ctaButton.disabled = true;
                ctaButton.classList.add('bg-surface-dim', 'text-on-surface-variant', 'cursor-not-allowed', 'opacity-70');
                ctaButton.classList.remove('bg-primary-container', 'text-on-primary-container', 'active:scale-95');
                ctaButton.style.backgroundColor = '';
                ctaButton.style.color = '';
            }
        });

        // Micro-interaction for the shield icon
        const shieldIcon = document.querySelector('[data-icon="security"]');
        if (shieldIcon) {
            shieldIcon.parentElement.addEventListener('mouseenter', () => {
                shieldIcon.style.transform = 'scale(1.1) rotate(5deg)';
                shieldIcon.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            });
            shieldIcon.parentElement.addEventListener('mouseleave', () => {
                shieldIcon.style.transform = 'scale(1) rotate(0deg)';
            });
        }
    </script>
</body></html>
